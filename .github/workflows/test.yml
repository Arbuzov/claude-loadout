name: test
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node plugins/secret-guard/hooks/test-secret-scan.mjs
      - run: node plugins/litellm-council/scripts/test.mjs
      - run: node plugins/nvidia-council/scripts/test.mjs
